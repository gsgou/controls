<?xml version="1.0" encoding="UTF-8"?>
<!-- A bundled asset that exercises the parts of SVG worth demonstrating: a viewBox that is not the
     display size, gradients in both flavours, a clipPath, nested transforms and grouped opacity. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0EA5E9" />
      <stop offset="1" stop-color="#312E81" />
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FDE68A" />
      <stop offset="1" stop-color="#F59E0B" />
    </radialGradient>
    <clipPath id="frame">
      <rect x="8" y="8" width="224" height="144" rx="16" ry="16" />
    </clipPath>
    <style>
      .ridge { fill: #1E293B; }
      .snow  { fill: #E2E8F0; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="240" height="160" fill="url(#sky)" />
    <circle cx="186" cy="44" r="22" fill="url(#sun)" />

    <g opacity="0.9">
      <polygon class="ridge" points="0,160 70,64 140,160" />
      <polygon class="snow" points="70,64 92,94 48,94" />
    </g>

    <g transform="translate(120 0)">
      <polygon class="ridge" points="0,160 60,86 120,160" />
      <polygon class="snow" points="60,86 76,108 44,108" />
    </g>

    <path d="M0 148 Q60 138 120 148 T240 148 L240 160 L0 160 Z"
          fill="#0F172A" fill-opacity="0.65" />
  </g>

  <rect x="8" y="8" width="224" height="144" rx="16" ry="16"
        fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8 4" />
</svg>
